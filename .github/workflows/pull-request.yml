name: pull-request

on:
  push:
    branches: ["main"]
  pull_request:
    # trigger all branches
jobs:
  pull-request-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: '3.13.12'
    # Setup uv and handle caching
    - name: Setup uv
      uses: astral-sh/setup-uv@v7
      with:
        version: '0.10.11'
        # Caches the uv executable and its internal cache directories
        enable-cache: true
        cache-dependency-blob: |
          pyproject.toml
    # Create a virtual environment and install dependencies
    - name: Setup venv
      run: make venv
    - name: Check code formatting
      run: make ruff-check
    - name: Check unit tests
      run: make test
